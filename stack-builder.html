<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Make Your Stack — STACK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./builder.css" />
</head>
<body class="builder-page">

  <!-- NAV -->
  <div class="nav-overlay" id="nav-overlay"></div>
  <nav class="nav">
    <a href="./index.html" class="nav-logo"><img src="images/logov3.png" alt="STACK" class="nav-logo-img"></a>
    <ul class="nav-links" id="nav-links">
      <li><a href="./index.html">Home</a></li>
      <li><a href="./index.html#about">About</a></li>
      <li><a href="./index.html#contact">Contact</a></li>
      <li><a href="./stack-builder.html" class="nav-cta nav-cta--active">Make Your Stack</a></li>
    </ul>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- BUILDER LAYOUT -->
  <div class="builder-layout">

    <!-- 3D CANVAS -->
    <div class="builder-canvas-wrap">
      <canvas id="builder-canvas"></canvas>

      <!-- Loading indicator -->
      <div class="builder-loading" id="builder-loading">
        <div class="builder-loading-dot"></div>
        <div class="builder-loading-dot"></div>
        <div class="builder-loading-dot"></div>
      </div>

      <!-- Back button (top-left, visible only in pod detail view) -->
      <button class="pod-back-btn" id="pod-back-btn" aria-label="Back to full stack">
        ← Back to stack
      </button>

      <!-- Pod labels (positioned by JS each frame) -->
      <div id="builder-labels" class="blabel-container"></div>

    </div>

    <!-- Selected config info (desktop: bottom-left overlay on canvas; mobile: block between canvas and panel) -->
    <div class="builder-selected-info">
      <div class="builder-selected-name" id="selected-config-name">—</div>
      <div class="builder-selected-tagline" id="selected-config-desc">Select a stack from the menu</div>
      <div class="builder-selected-pods" id="selected-config-pods"></div>
      <div class="builder-common-stack-wrap">
        <div class="builder-common-stack-label">Common stacks</div>
        <div class="builder-common-stack-text" id="selected-config-common-stack"></div>
      </div>
    </div>

    <!-- Pod detail panel (desktop: absolute overlay left of canvas; mobile: section below canvas) -->
    <div class="pod-detail-panel" id="pod-detail-panel">
      <div class="pod-detail-name" id="pod-detail-name"></div>
      <div class="pod-detail-desc" id="pod-detail-desc"></div>
      <ul class="pod-detail-specs" id="pod-detail-specs"></ul>
      <div class="pod-detail-examples-label">Common supplements</div>
      <div class="pod-detail-examples" id="pod-detail-examples"></div>
    </div>

    <!-- RIGHT PANEL -->
    <aside class="builder-panel">
      <div class="builder-panel-head">
        <div class="section-eyebrow">Popular Pilr Builds</div>
        <h2>Choose your stack</h2>
        <p>Click through the builds to find the stack that keeps your routine consistent anywhere</p>
      </div>

      <div class="builder-panel-list" id="config-list">
        <!-- Populated by JS -->
      </div>

      <div class="builder-panel-foot">
        <button id="add-to-cart-btn" class="btn" style="width:100%;text-align:center" disabled>
          Loading…
        </button>
      </div>
    </aside>

  </div>

  <script>
    // Hamburger menu (matches index.html pattern)
    const hamburger = document.getElementById('nav-hamburger')
    const navLinks  = document.getElementById('nav-links')
    const overlay   = document.getElementById('nav-overlay')
    function closeMenu() {
      hamburger.classList.remove('open')
      navLinks.classList.remove('open')
      overlay.classList.remove('open')
    }
    hamburger.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open')
      hamburger.classList.toggle('open', open)
      overlay.classList.toggle('open', open)
    })
    overlay.addEventListener('click', closeMenu)
    navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu))
  </script>

  <script type="module" src="/src/builder.js"></script>
  <script type="module" src="/src/shopify.js"></script>
</body>
</html>
